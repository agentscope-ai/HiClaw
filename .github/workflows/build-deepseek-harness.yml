name: Build DeepSeek Harness Runtime

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Independent DeepSeek Harness runtime version (e.g. v0.1.0)'
        required: true
        type: string
        default: 'v0.1.0'
  push:
    branches:
      - main
    tags:
      - 'deepseek-harness-v[0-9]+.[0-9]+.[0-9]+'
      - 'deepseek-harness-v[0-9]+.[0-9]+.[0-9]+-*'
    paths:
      - 'deepseek-harness/**'
      - 'plugins/teamharness/**'
      - 'shared/lib/**'
      - 'Makefile'
      - '.github/workflows/build-deepseek-harness.yml'

env:
  REGISTRY: higress-registry.cn-hangzhou.cr.aliyuncs.com
  REPO: agentteams

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Free Up GitHub Actions Ubuntu Runner Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve runtime version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/deepseek-harness-* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#deepseek-harness-}"
          else
            VERSION="sha-$(echo '${{ github.sha }}' | cut -c1-12)"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/deepseek-harness-* ]]; then
            if ! echo "${VERSION}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
              echo "ERROR: invalid runtime version: ${VERSION}"
              exit 1
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push runtime image
        run: |
          make push-deepseek-harness-worker \
            DEEPSEEK_HARNESS_WORKER_VERSION=${{ steps.meta.outputs.version }} \
            REGISTRY=${{ env.REGISTRY }} \
            REPO=${{ env.REPO }} \
            DOCKER_BUILD_ARGS="--build-arg APT_MIRROR= --build-arg PIP_INDEX_URL=https://pypi.org/simple/"

      - name: Verify published image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.REPO }}/agentteams-deepseek-harness-worker:${VERSION}"
          docker buildx imagetools inspect "${IMAGE}"
          echo "### DeepSeek Harness Runtime" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platforms: \`linux/amd64, linux/arm64\`" >> "$GITHUB_STEP_SUMMARY"
